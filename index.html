<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Repayment Tracker</title>
<meta name="description" content="Track loans with daily interest: record payments, see outstanding balance, ledger and early-closure plans.">
<meta name="theme-color" content="#f3f1eb">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 15.5h14M5 12.5V8.5M10 12.5V5.5M15 12.5V9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <div><div class="bname">Loan Repayment Tracker</div><div class="bsub">Daily interest, payments and early-closure plans</div></div>
    </div>
    <div class="topright">
    <label class="cur" for="cur-select"><span class="sr">Base currency</span><select id="cur-select" aria-label="Base currency"></select></label>
    <nav class="tabs" aria-label="Views">
      <a href="#dashboard" data-tab="dashboard">My loans</a>
      <a href="#ledger" data-tab="ledger">Ledger</a>
      <a href="#calculator" data-tab="calculator">Calculator</a>
    </nav>
    </div>
  </div>
</header>
<div id="banner" class="wrap" hidden></div>
<main id="app" class="wrap"></main>

<div class="overlay" id="copybox" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="copybox-title">
    <h2 id="copybox-title">Copy this text</h2>
    <p class="muted" id="copybox-hint">Your browser blocked automatic copying. Select all of the text below and copy it.</p>
    <textarea id="copybox-text" readonly></textarea>
    <div class="btns"><button id="copybox-close" class="primary">Done</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/assets/app.js"></script>
</body>
</html>
